<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        background-color: #f5f5f5;
        padding: 20px;
        line-height: 1.6;
      }
      .email-container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .header-banner {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        height: 150px;
        width: 100%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .header-icon {
        font-size: 60px;
        color: white;
      }
      .content {
        padding: 40px 30px;
      }
      .greeting {
        font-size: 24px;
        font-weight: 600;
        color: #1f2937;
        margin-bottom: 20px;
      }
      .message {
        color: #4b5563;
        font-size: 15px;
        line-height: 1.8;
        margin-bottom: 30px;
      }
      .code-box {
        background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        border: 2px solid #3b82f6;
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        margin: 30px 0;
      }
      .code {
        font-size: 32px;
        font-weight: bold;
        color: #1e40af;
        letter-spacing: 8px;
        font-family: 'Courier New', monospace;
      }
      .code-label {
        margin-top: 10px;
        color: #6b7280;
        font-size: 13px;
      }
      .cta-button {
        display: inline-block;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #ffffff;
        text-decoration: none;
        padding: 14px 40px;
        border-radius: 50px;
        font-weight: 600;
        font-size: 15px;
      }
      .button-container {
        text-align: center;
        margin: 30px 0;
      }
      .info-box {
        background-color: #fef3c7;
        border-left: 4px solid #f59e0b;
        padding: 15px;
        margin: 20px 0;
        border-radius: 4px;
      }
      .info-box p {
        color: #92400e;
        font-size: 14px;
        margin: 0;
      }
      .footer {
        background-color: #f9fafb;
        padding: 30px;
        text-align: center;
        border-top: 1px solid #e5e7eb;
      }
      .footer-links {
        margin-bottom: 20px;
      }
      .footer-links a {
        color: #6b7280;
        text-decoration: none;
        margin: 0 15px;
        font-size: 13px;
      }
      .copyright {
        color: #9ca3af;
        font-size: 12px;
        margin-top: 15px;
      }
      .security-note {
        background-color: #fee2e2;
        border-left: 4px solid #ef4444;
        padding: 15px;
        margin: 20px 0;
        border-radius: 4px;
      }
      .security-note p {
        color: #991b1b;
        font-size: 14px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="email-container">
      <div class="header-banner">
        <div class="header-icon">{{icon}}</div>
      </div>
      <div class="content">
        <h1 class="greeting">Bonjour {{userName}},</h1>
        <p class="message">{{message}}</p>

        {{codeSection}} {{ctaSection}} {{infoSection}} {{securitySection}}
      </div>
      <div class="footer">
        <div class="footer-links">
          <a href="{{helpCenterLink}}">Centre d'aide</a>
          <a href="{{privacyPolicyLink}}">Politique de confidentialité</a>
        </div>
        <div class="copyright">
          © {{year}} {{companyName}}. Tous droits réservés.
        </div>
      </div>
    </div>
  </body>
</html>
